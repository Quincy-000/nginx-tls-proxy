# Step 3: forwarded headers and a log format. TLS and the redirect come later.
log_format proxy '$remote_addr [$time_local] "$request" $status '
                 'upstream=$upstream_addr rt=$request_time '
                 'xff=$http_x_forwarded_for';

upstream app_upstream {
    server app:8000;
}

server {
    listen 80;
    server_name localhost;

    # The published port must be explicit: nginx inside the container cannot know
    # it, and a bare $host would send clients to 443, which is not published.
    return 301 https://$host:8443$request_uri;
}

