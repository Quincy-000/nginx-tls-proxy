# Step 4: TLS listener. No redirect yet — that is step 5.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Explicit for readability: current nginx already defaults to these.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Short max-age on localhost. Browsers ignore HSTS for untrusted certs, so
    # this only takes effect if the cert is ever trusted.
    add_header Strict-Transport-Security "max-age=60" always;

    client_max_body_size 1m;
    proxy_read_timeout   10s;

    access_log /var/log/nginx/access.log proxy;

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://app_upstream;
    }
}
